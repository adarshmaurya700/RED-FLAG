name: Daily source scanner
on:
  schedule:
    - cron: "47 0 * * *" # 06:17 Asia/Kolkata; GitHub schedules are best effort.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-source-scanner
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock
      - name: Collect bounded public source catalogue
        run: python scripts/scan_sources.py --output tmp/catalog.json --from-published
      - uses: actions/upload-artifact@v4
        with:
          name: source-catalogue
          path: tmp/catalog.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: source-catalogue
          path: tmp
      - name: Validate and publish data branch
        run: python scripts/publish_source_catalog.py tmp/catalog.json
