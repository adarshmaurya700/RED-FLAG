envVarGroups:
  - name: red-flag-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: TASK_MODE
        value: celery
      - key: INITIALIZE_DATABASE
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
services:
  - type: web
    name: red-flag-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: red-flag-shared
      - key: HOSTED_OPERATOR_PASSWORD
        sync: false
      - key: API_HOST
        fromService: {type: pserv, name: red-flag-api, property: host}
      - key: API_PORT
        value: "8000"
  - type: pserv
    name: red-flag-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log'
    preDeployCommand: alembic upgrade head && python seed_demo_data.py
    envVars: &server-env
      - fromGroup: red-flag-shared
      - key: DATABASE_URL
        fromDatabase: {name: red-flag-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: red-flag-queue, property: connectionString}
  - type: worker
    name: red-flag-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=warning --concurrency=2
    envVars: *server-env
  - type: worker
    name: red-flag-scheduler
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=warning --schedule=/tmp/red-flag-celerybeat
    envVars: *server-env
  - type: keyvalue
    name: red-flag-queue
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: red-flag-db
    plan: basic-256mb
    region: singapore
    databaseName: redflag
    user: redflag
    ipAllowList: []
